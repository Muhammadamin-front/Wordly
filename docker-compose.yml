services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: words
      POSTGRES_PASSWORD: words
      POSTGRES_DB: words
    ports:
      # Override with POSTGRES_PORT if 5432 is taken on the host.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U words"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Override with REDIS_PORT if 6379 is taken on the host.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-change-me-32-bytes!}
      DATABASE_URL: postgresql+asyncpg://words:words@postgres:5432/words
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      FIREFLIES_API_KEY: ${FIREFLIES_API_KEY:-}
      PAYMENTS_SANDBOX: ${PAYMENTS_SANDBOX:-true}
    ports:
      # Override with API_PORT if 8000 is taken on the host.
      - "${API_PORT:-8000}:8000"
    volumes:
      - tts_cache:/srv/api/tts_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/detail')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
        # Baked into the client bundle at build time — the browser calls this.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      # Override with WEB_PORT if 3000 is taken on the host.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  tts_cache:

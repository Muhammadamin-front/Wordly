services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-words}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-words}
      POSTGRES_DB: ${POSTGRES_DB:-words}
    ports:
      # Override with POSTGRES_PORT if 5432 is taken on the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Override with REDIS_PORT if 6379 is taken on the host.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    environment: &api-environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # Safe only for local development; production startup rejects this value.
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://words:words@postgres:5432/words}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      ELEVENLABS_SPEED: ${ELEVENLABS_SPEED:-1.0}
      # Slower than default synthesis: the mock listening test has to be
      # transcribable, spelled-out names included.
      ELEVENLABS_LISTENING_SPEED: ${ELEVENLABS_LISTENING_SPEED:-0.88}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      FIREFLIES_API_KEY: ${FIREFLIES_API_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_MERCHANT_KEY: ${PAYME_MERCHANT_KEY:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      CLICK_CHECKOUT_URL: ${CLICK_CHECKOUT_URL:-https://my.click.uz/services/pay}
      UZUM_TERMINAL_ID: ${UZUM_TERMINAL_ID:-}
      UZUM_API_KEY: ${UZUM_API_KEY:-}
      UZUM_WEBHOOK_SECRET: ${UZUM_WEBHOOK_SECRET:-}
      UZUM_API_BASE_URL: ${UZUM_API_BASE_URL:-https://developer.uzumbank.uz/api/v1}
      PAYMENTS_SANDBOX: ${PAYMENTS_SANDBOX:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Each worker holds its own DB pool: workers x (DB_POOL_SIZE +
      # DB_MAX_OVERFLOW) must stay under Postgres max_connections (100).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    ports:
      # Override with API_PORT if 8000 is taken on the host.
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - tts_cache:/srv/api/tts_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/detail')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./apps/api
    restart: unless-stopped
    # Same image and same environment as the API; it differs only in what it
    # runs. Migrations are applied by deploy.sh before either starts.
    environment: *api-environment
    command: ["python", "-m", "scripts.worker"]
    volumes:
      - tts_cache:/srv/api/tts_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
        # Baked into the client bundle at build time — the browser calls this.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vocora.uz}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_APPLE_CLIENT_ID: ${NEXT_PUBLIC_APPLE_CLIENT_ID:-}
        NEXT_PUBLIC_APPLE_REDIRECT_URI: ${NEXT_PUBLIC_APPLE_REDIRECT_URI:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_TELEGRAM_BOT_ID: ${NEXT_PUBLIC_TELEGRAM_BOT_ID:-}
        # DSNs are not secret; baked into the browser bundle like the vars above.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      # Server-side instrumentation.ts reads this at runtime (Node.js), same
      # value as the build arg above.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vocora.uz}
    ports:
      # Override with WEB_PORT if 3000 is taken on the host.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles: ["production"]
    restart: unless-stopped
    # This tunnel's public-hostname ingress rules are configured remotely in
    # the Cloudflare dashboard (token-based tunnel, no local config.yml) and
    # point at http://localhost:3000 / http://localhost:8000 — on the
    # default bridge network "localhost" is this container's own loopback,
    # not the host's, so cloudflared could never actually reach web/api that
    # way (silent 502s on every request). host networking makes "localhost"
    # resolve to the same host web/api already publish their ports on.
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      # Environment form keeps the token out of process listings.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  tts_cache:

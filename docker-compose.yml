services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: words
      POSTGRES_PASSWORD: words
      POSTGRES_DB: words
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U words"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-change-me-32-bytes!}
      DATABASE_URL: postgresql+asyncpg://words:words@postgres:5432/words
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:

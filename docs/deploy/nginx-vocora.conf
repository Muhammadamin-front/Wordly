# Vocora reverse proxy — origin-side defense-in-depth *under* Cloudflare.
#
# Cloudflare's edge is what actually absorbs a volumetric (millions-req/sec)
# DDoS flood — that layer is configured in the Cloudflare dashboard, not
# here (see docs/deploy.md's "DDoS posture" section). This config's job is
# everything Cloudflare can't do for you at the origin:
#   - resolve the *real* visitor IP (Cloudflare replaces $remote_addr with
#     its own edge IP unless you tell nginx to trust CF-Connecting-IP), so
#     per-IP limits below — and the app's own TRUSTED_PROXY_CIDRS-gated
#     rate limiter — see genuine client IPs, not Cloudflare's;
#   - a per-IP request-rate and connection cap at the origin itself, so a
#     flood that *does* reach the origin (a misconfigured DNS record, a
#     leaked origin IP, Cloudflare temporarily bypassed) doesn't take the
#     single API/web process down with it;
#   - correct WebSocket upgrade handling for the two long-lived sockets
#     (multiplayer quiz, live speaking coach) — get this wrong and Cloudflare
#     will happily proxy a connection nginx immediately drops.
#
# Cloudflare IP ranges below are current as of 2026-08 (fetched from
# https://www.cloudflare.com/ips-v4 and /ips-v6). They change rarely but not
# never — re-fetch periodically rather than trusting this file forever.

# --- Trust Cloudflare's real-IP header, only from Cloudflare's own ranges --
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Per-IP throttles (defense-in-depth; Cloudflare's own Rate Limiting
# Rules, configured in the dashboard, are the first line of defense) -------
limit_req_zone $binary_remote_addr zone=vocora_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vocora_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=vocora_conn:10m;

# Requests presenting a Host header that isn't one of ours never reach a
# named server block below — this alone silences a lot of scanner/flood
# noise (it never bothers with the real domain) at effectively zero cost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name vocora.uz api.vocora.uz;
    # ACME challenge path should still resolve over plain HTTP if you use
    # certbot/acme.sh here instead of Cloudflare-issued origin certs.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vocora.uz;

    # ssl_certificate / ssl_certificate_key: point at either a Cloudflare
    # Origin CA certificate (recommended — pairs with SSL/TLS mode "Full
    # (strict)" in the dashboard) or a normal cert for this host.

    client_max_body_size 5m;
    limit_req zone=vocora_general burst=40 nodelay;
    limit_conn vocora_conn 40;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.vocora.uz;

    client_max_body_size 5m;
    limit_req zone=vocora_general burst=40 nodelay;
    limit_conn vocora_conn 40;

    # A tighter zone on auth — these are the routes worth slowing down the
    # most: password guessing, registration spam, token-refresh abuse. The
    # app's own RATE_LIMIT_LOGIN/RATE_LIMIT_REGISTER (app/core/config.py)
    # already enforce this per-account; this is the per-IP backstop in
    # front of it.
    location /api/v1/auth/ {
        limit_req zone=vocora_auth burst=10 nodelay;
        limit_conn vocora_conn 10;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket routes — multiplayer quiz and live speaking coach. Both
    # already carry their own per-IP handshake throttle at the app layer
    # (RATE_LIMIT_WS_CONNECT); this block is what makes the upgrade work at
    # all through nginx, plus a slightly lower connection cap since each
    # one is long-lived rather than request/response.
    location ~ ^/api/v1/(ws/quiz|coach/sessions/[^/]+/live)$ {
        limit_conn vocora_conn 20;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

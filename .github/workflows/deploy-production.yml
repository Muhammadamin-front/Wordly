name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production server
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 30
    steps:
      - name: Deploy CI-verified commit
        run: /home/kitsune/Wordly/deploy.sh "${{ github.event.workflow_run.head_sha }}"

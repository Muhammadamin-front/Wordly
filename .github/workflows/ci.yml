name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — pytest (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q

  api-postgres:
    name: API — pytest (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: words
          POSTGRES_PASSWORD: words
          POSTGRES_DB: words_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U words"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      # Migrations + seed must hold on Postgres. A separate database from the
      # pytest one — the test fixture's create_all would collide with alembic.
      - run: PGPASSWORD=words psql -h localhost -U words -d words_test -c "CREATE DATABASE words_migrate;"
      - run: alembic upgrade head && python -m scripts.seed
        env:
          DATABASE_URL: postgresql+asyncpg://words:words@localhost:5432/words_migrate
      # Same suite as the SQLite job, but against the production engine —
      # catches dialect drift (UUID handling, constraint semantics, JSON).
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://words:words@localhost:5432/words_test

  web:
    name: Web — typecheck + lint + vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm workspace `ci` skips platform-specific optional deps when the
      # lockfile was written on another OS (npm/cli#4828) — reinstall the
      # native bindings Tailwind v4 needs (same workaround as apps/web/Dockerfile).
      - run: npm install --no-save lightningcss @tailwindcss/oxide
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run lint --workspace web
      - run: npm run test --workspace web
      - run: npm run build --workspace web
      - run: npm audit --omit=dev --workspace=web --audit-level=high

  mobile:
    name: Mobile — typecheck + release config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run check:release
        env:
          EXPO_PUBLIC_API_URL: https://api.vocora.uz
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 000000000000-ci-web.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 000000000000-ci-ios.apps.googleusercontent.com
      # Expo SDK 54's CLI/Metro build chain currently carries upstream high
      # advisories with no non-breaking fix. They are not shipped as an
      # executable server in the native app; still block any critical advisory.
      - run: npm audit --omit=dev --audit-level=critical
